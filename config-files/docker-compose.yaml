services:
  smtp:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:25
    ports:
      - 127.0.0.1:25:25
      - 127.0.0.1:8025:8025
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.0}
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp:25
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=play-demo@grafana.com
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning