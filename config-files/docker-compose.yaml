services:
  smtp:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:25
    ports:
      - 127.0.0.1:25:25
      - 127.0.0.1:8025:8025
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.0}
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp:25
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=play-demo@grafana.com
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning